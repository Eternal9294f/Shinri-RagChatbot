services:
  - type: web
    name: shinri-mf-rag
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python -c 'from sentence_transformers import SentenceTransformer; SentenceTransformer(\"sentence-transformers/all-MiniLM-L6-v2\")'"
    startCommand: "uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: HF_HUB_OFFLINE
        value: "0"
